services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eare_test
      POSTGRES_USER: eare_test
      POSTGRES_PASSWORD: eare_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eare_test -d eare_test"]
      interval: 2s
      timeout: 3s
      retries: 30
