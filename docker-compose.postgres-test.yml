name: aurora-postgres-test

services:
  aurora-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurora_test
      POSTGRES_USER: aurora_test
      POSTGRES_PASSWORD: aurora_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_test -d aurora_test"]
      interval: 2s
      timeout: 3s
      retries: 30
