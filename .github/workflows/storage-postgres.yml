name: Storage SQLite and PostgreSQL parity

on:
  push:
    paths:
      - "src/aurora/database.py"
      - "src/aurora/storage.py"
      - "src/aurora/system_admin.py"
      - "src/aurora/web_jobs.py"
      - "src/aurora/web_read_models.py"
      - "src/aurora/web_use_cases.py"
      - "src/aurora/api.py"
      - "src/aurora/cli/main.py"
      - "tests/test_storage_backend_parity.py"
      - "tests/test_preview_database_urls.py"
      - "tests/test_alembic_postgres.py"
      - "migrations/**"
      - "alembic.ini"
      - "docker-compose.postgres-test.yml"
      - "pyproject.toml"
      - ".github/workflows/storage-postgres.yml"
  pull_request:
    paths:
      - "src/aurora/database.py"
      - "src/aurora/storage.py"
      - "src/aurora/system_admin.py"
      - "src/aurora/web_jobs.py"
      - "src/aurora/web_read_models.py"
      - "src/aurora/web_use_cases.py"
      - "src/aurora/api.py"
      - "src/aurora/cli/main.py"
      - "tests/test_storage_backend_parity.py"
      - "tests/test_preview_database_urls.py"
      - "tests/test_alembic_postgres.py"
      - "migrations/**"
      - "alembic.ini"
      - "docker-compose.postgres-test.yml"
      - "pyproject.toml"
      - ".github/workflows/storage-postgres.yml"

jobs:
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora_test
          POSTGRES_PASSWORD: aurora_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora_test -d aurora_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AURORA_TEST_POSTGRES_URL: postgresql+psycopg://aurora_test:aurora_test_only@localhost:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[app,dev]"
      - name: SQLite repository and Preview contracts
        run: >-
          pytest -q
          tests/test_storage_backend_parity.py
          tests/test_preview_database_urls.py
          -m "not postgres"
      - name: PostgreSQL repository, parity, Preview and Alembic contracts
        run: >-
          pytest -q
          -m postgres
          tests/test_storage_backend_parity.py
          tests/test_preview_database_urls.py
          tests/test_alembic_postgres.py
      - name: Alembic current on the test database
        run: alembic current
        env:
          AURORA_DATABASE_URL: ${{ env.AURORA_TEST_POSTGRES_URL }}
      - name: Full regression suite
        run: pytest -q
