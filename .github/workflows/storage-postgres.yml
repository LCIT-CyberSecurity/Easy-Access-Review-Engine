name: Storage SQLite and PostgreSQL parity

on:
  push:
    paths:
      - "src/access_review_engine/database.py"
      - "src/access_review_engine/storage.py"
      - "src/access_review_engine/system_admin.py"
      - "src/access_review_engine/web_jobs.py"
      - "src/access_review_engine/web_use_cases.py"
      - "tests/test_storage_backend_parity.py"
      - "migrations/**"
      - "docker-compose.postgres-test.yml"
      - "pyproject.toml"
      - ".github/workflows/storage-postgres.yml"
  pull_request:
    paths:
      - "src/access_review_engine/database.py"
      - "src/access_review_engine/storage.py"
      - "src/access_review_engine/system_admin.py"
      - "src/access_review_engine/web_jobs.py"
      - "src/access_review_engine/web_use_cases.py"
      - "tests/test_storage_backend_parity.py"
      - "migrations/**"
      - "docker-compose.postgres-test.yml"
      - "pyproject.toml"
      - ".github/workflows/storage-postgres.yml"

jobs:
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eare_test
          POSTGRES_USER: eare_test
          POSTGRES_PASSWORD: eare_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eare_test -d eare_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EARE_TEST_POSTGRES_URL: postgresql+psycopg://eare_test:eare_test_only@localhost:5432/eare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[app,dev]"
      - run: pytest -q
      - run: pytest -q -m postgres tests/test_storage_backend_parity.py
      - run: alembic upgrade head && alembic current
        env:
          EARE_DATABASE_URL: ${{ env.EARE_TEST_POSTGRES_URL }}
