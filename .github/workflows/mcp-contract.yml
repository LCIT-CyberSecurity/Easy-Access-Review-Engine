name: MCP contract

on:
  pull_request:
    paths:
      - "src/aurora/mcp_*.py"
      - "src/aurora/system_admin.py"
      - "src/aurora/api.py"
      - "tests/test_mcp_*.py"
      - "web/nginx.conf"
      - "web/src/App.tsx"
      - "web/src/**/*.test.ts"
      - ".github/workflows/mcp-contract.yml"
  push:
    paths:
      - "src/aurora/mcp_*.py"
      - "src/aurora/system_admin.py"
      - "src/aurora/api.py"
      - "tests/test_mcp_*.py"
      - "web/nginx.conf"
      - "web/src/App.tsx"
      - "web/src/**/*.test.ts"
      - ".github/workflows/mcp-contract.yml"

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[app,dev]"
      - run: pytest -q tests/test_mcp_security.py
      - run: cd web && npm ci && npm test && npm run build
