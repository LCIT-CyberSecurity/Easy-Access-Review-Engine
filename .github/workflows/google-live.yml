name: Google connector live checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  live:
    if: ${{ vars.GOOGLE_LIVE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[app,dev,google]"
      - name: Run guarded live tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          EARE_WORKSPACE_CUSTOMER_ID: ${{ vars.EARE_WORKSPACE_CUSTOMER_ID }}
          EARE_WORKSPACE_DELEGATED_ADMIN: ${{ vars.EARE_WORKSPACE_DELEGATED_ADMIN }}
          EARE_GCP_SCOPE: ${{ vars.EARE_GCP_SCOPE }}
        run: |
          umask 077
          credential_file="$RUNNER_TEMP/eare-google-service-account.json"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$credential_file"
          export EARE_WORKSPACE_CREDENTIALS_FILE="$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          pytest -q tests/test_google_live.py
