name: Chatbot contract

on:
  push:
    paths:
      - "src/access_review_engine/chatbot/**"
      - "src/access_review_engine/api.py"
      - "tests/test_chatbot*.py"
      - "web/src/chatbot/**"
      - "web/src/App.tsx"
      - "web/src/styles.css"
      - "docs/chatbot*"
      - ".github/workflows/chatbot-contract.yml"
  pull_request:
    paths:
      - "src/access_review_engine/chatbot/**"
      - "src/access_review_engine/api.py"
      - "tests/test_chatbot*.py"
      - "web/src/chatbot/**"
      - "web/src/App.tsx"
      - "web/src/styles.css"
      - "docs/chatbot*"
      - ".github/workflows/chatbot-contract.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[app,dev]"
      - run: python -m pytest -q tests/test_chatbot.py tests/test_chatbot_api.py tests/test_chatbot_security_v1.py tests/test_campaign_scopes.py tests/test_guidance.py tests/test_golden_functional_api.py
      - run: ruff check src/access_review_engine/chatbot tests/test_chatbot.py tests/test_chatbot_api.py tests/test_chatbot_security_v1.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm run build
