name: Keycloak connector contract

on:
  push:
    paths:
      - "src/access_review_engine/collectors/keycloak.py"
      - "src/access_review_engine/importers/keycloak.py"
      - "src/access_review_engine/application.py"
      - "tests/test_keycloak_collector.py"
      - "tests/importers/test_keycloak.py"
      - ".github/workflows/keycloak-contract.yml"
  pull_request:
    paths:
      - "src/access_review_engine/collectors/keycloak.py"
      - "src/access_review_engine/importers/keycloak.py"
      - "src/access_review_engine/application.py"
      - "tests/test_keycloak_collector.py"
      - "tests/importers/test_keycloak.py"
      - ".github/workflows/keycloak-contract.yml"

permissions:
  contents: read

jobs:
  keycloak-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and development dependencies
        run: python -m pip install -e ".[app,dev]"
      - name: Run Keycloak contract tests
        run: pytest -q tests/importers/test_keycloak.py tests/test_keycloak_collector.py
      - name: Run Ruff
        run: ruff check .
