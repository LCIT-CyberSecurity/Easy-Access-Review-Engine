# Aurora redesign preview stack.
#
# Deliberately isolated from the regular `web/compose.yaml` deployment: its own
# compose project, container names, port and data volume, so the integration
# stack on 4173 keeps running untouched while the redesign is reviewed on 4175.
#
#   docker compose -f docker/compose.aurora.yaml up -d --build
#
# Expects a .env beside it holding EARE_SESSION_SECRET, EARE_ADMIN_USERNAME,
# EARE_ADMIN_PASSWORD and EARE_COOKIE_SECURE (see .env.example).
name: eare-aurora

services:
  eare-api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: eare-api:aurora
    container_name: eare-aurora-api
    env_file:
      - ../.env
    environment:
      EARE_DB_PATH: /data/access-review.db
    volumes:
      - eare-aurora-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  eare-webui:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: eare-webui:aurora
    container_name: eare-aurora-webui
    depends_on:
      eare-api:
        condition: service_healthy
    ports:
      - "4175:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  eare-aurora-data:
    name: eare-aurora-data
