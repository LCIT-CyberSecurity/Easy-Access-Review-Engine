# Aurora redesign preview stack.
#
# Deliberately isolated from the regular `web/compose.yaml` deployment: its own
# compose project, container names, port and data volume, so the integration
# stack on 4173 keeps running untouched while the redesign is reviewed on 4175.
#
#   docker compose -f docker/compose.aurora.yaml up -d --build
#
# Expects a .env beside it holding AURORA_SESSION_SECRET, AURORA_ADMIN_USERNAME,
# AURORA_ADMIN_PASSWORD and AURORA_COOKIE_SECURE (see .env.example).
name: aurora-preview

services:
  aurora-api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: aurora-api:preview
    container_name: aurora-preview-api
    env_file:
      - ../.env
    environment:
      AURORA_DB_PATH: /data/aurora.db
      AURORA_ADMIN_USERNAME: ${AURORA_ADMIN_USERNAME:-admin}
      AURORA_ADMIN_PASSWORD: ${AURORA_ADMIN_PASSWORD:-SecretPassword}
      AURORA_KEYCLOAK_CLIENT_SECRET: ${AURORA_KEYCLOAK_CLIENT_SECRET:-}
    volumes:
      - aurora-preview-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  aurora-webui:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: aurora-webui:aurora
    container_name: aurora-preview-webui
    depends_on:
      aurora-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4175:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  aurora-preview-data:
    name: aurora-preview-data
