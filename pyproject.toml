[project]
name = "aurora"
version = "0.1.0"
description = "Open source access review, comparison and recertification engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
app = [
  "mcp>=2.2,<3",
  "alembic>=1.13",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "authlib>=1.3,<2",
  "httpx>=0.27,<1",
  "cryptography>=43.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
google = [
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
]

[project.scripts]
aurora = "aurora.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "live_google: opt-in tests requiring configured Google lab credentials",
  "postgres: tests requiring AURORA_TEST_POSTGRES_URL",
]

[tool.coverage.run]
source = ["src/aurora"]
