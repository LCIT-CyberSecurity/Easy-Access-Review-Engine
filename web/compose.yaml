name: aurora

services:
  aurora-api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: aurora-api:python312
    container_name: aurora-app-api
    env_file:
      - ../.env
    environment:
      AURORA_DB_PATH: /data/aurora.db
    volumes:
      - aurora-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  aurora-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-webui:nginx
    container_name: aurora-app-webui
    depends_on:
      aurora-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  aurora-data:
    name: aurora-data
