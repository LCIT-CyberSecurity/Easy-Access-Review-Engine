name: eare-keycloak-crashtest

services:
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: EARE Test
      LDAP_DOMAIN: eare.test
      LDAP_ADMIN_PASSWORD: eare-ldap-admin-runtime
    ports:
      - "127.0.0.1:1389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -D cn=admin,dc=eare,dc=test -w eare-ldap-admin-runtime -b dc=eare,dc=test -s base >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-db-runtime
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-db-runtime
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: eare-keycloak-admin-runtime
    depends_on:
      keycloak-db:
        condition: service_healthy
      openldap:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

  eare-api:
    build:
      context: ../../..
      dockerfile: docker/backend.Dockerfile
    environment:
      EARE_DB_PATH: /data/access-review.db
      EARE_SESSION_SECRET: eare-keycloak-crashtest-session-runtime
      EARE_ADMIN_USERNAME: admin
      EARE_ADMIN_PASSWORD: eare-eare-admin-runtime
      EARE_COOKIE_SECURE: "false"
    volumes:
      - eare-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  eare-webui:
    build:
      context: ../../../web
      dockerfile: Dockerfile
    depends_on:
      eare-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4175:80"

volumes:
  keycloak-db-data:
    name: eare-keycloak-crashtest-keycloak-db
  eare-data:
    name: eare-keycloak-crashtest-eare-data
