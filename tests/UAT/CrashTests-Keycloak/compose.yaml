name: aurora-keycloak-crashtest

services:
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Aurora
      LDAP_DOMAIN: aurora.test
      LDAP_ADMIN_PASSWORD: ${AURORA_LDAP_PASSWORD:?set in .env.runtime}
      LDAP_TLS: "false"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -D cn=admin,dc=aurora,dc=test -w \"$$LDAP_ADMIN_PASSWORD\" -b dc=aurora,dc=test -s base >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env.runtime}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env.runtime}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env.runtime}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env.runtime}
    depends_on:
      keycloak-db:
        condition: service_healthy
      openldap:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

  aurora-api:
    build:
      context: ../../..
      dockerfile: docker/backend.Dockerfile
    environment:
      AURORA_DB_PATH: /data/aurora.db
      AURORA_SESSION_SECRET: ${AURORA_SESSION_SECRET:?set in .env.runtime}
      AURORA_ADMIN_USERNAME: admin
      AURORA_ADMIN_PASSWORD: ${AURORA_ADMIN_PASSWORD:?set in .env.runtime}
      AURORA_COOKIE_SECURE: "false"
    env_file:
      - .env.runtime
    volumes:
      - aurora-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  aurora-webui:
    build:
      context: ../../../web
      dockerfile: Dockerfile
    depends_on:
      aurora-api:
        condition: service_healthy
    ports:
      - "192.168.1.5:4175:80"

volumes:
  keycloak-db-data:
    name: aurora-keycloak-crashtest-keycloak-db
  aurora-data:
    name: aurora-keycloak-crashtest-aurora-data

networks:
  default:
    name: aurora-keycloak-crashtest_default
